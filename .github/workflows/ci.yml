name: CI Code Quality & Linting

on:
  push:
    branches: [ main, staging, develop, '**' ]
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  lint-frontend:
    name: Frontend Lint & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm install --no-save eslint eslint-config-next

      - name: Run Next.js Lint & Build Check
        working-directory: ./frontend
        run: |
          npm run lint || true
          npm run build

  check-backend:
    name: Backend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck Backend (tsc)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

  check-ai-service:
    name: AI Service Syntax & Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax & Compilation Check
        working-directory: ./service/ai-service
        run: python -m compileall app/

