name: CI Code Quality, Testing & Security Audit

on:
  push:
    branches: [ main, staging, develop, '**' ]
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  lint-frontend:
    name: Frontend Lint, Build & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm install --no-save eslint eslint-config-next

      - name: Run Next.js Lint, Domain Tests & Build Check
        working-directory: ./frontend
        run: |
          npm run lint || true
          node tests/admin-demo.test.cjs
          npm run build

  check-backend:
    name: Backend Typecheck, Build & Security Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck Backend (tsc)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

      - name: Run Jest Unit & Security Tests
        working-directory: ./backend
        run: npm test -- --runInBand

  check-ai-service:
    name: AI Service Syntax & Unit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax & Compilation Check
        working-directory: ./service/ai-service
        run: python -m compileall app/

  security-audit:
    name: OWASP Secret Hygiene & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets or Env Files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|id_rsa'; then
            echo "ERROR: Sensitive environment or key files committed to repository!"
            exit 1
          fi
          if git grep -n -E 'BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY' -- ':!SECURITY.md'; then
            echo "ERROR: Private key material detected in repository!"
            exit 1
          fi
          echo "Secret hygiene check passed."

      - name: Run Production Dependency Audit (Non-blocking Advisory Report)
        run: |
          echo "=== Backend Production Dependency Audit ==="
          npm --prefix backend audit --omit=dev || true
          echo "=== Frontend Production Dependency Audit ==="
          npm --prefix frontend audit --omit=dev || true
