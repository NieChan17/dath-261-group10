name: Staging Cloud Deployment

on:
  push:
    branches: [ staging, main, ThienNhan ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Staging Runner Target
        run: |
          echo "=== Initializing Staging Target Environment ==="
          sudo apt-get update -qq && sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          sudo usermod -aG docker runner 2>/dev/null || true
          mkdir -p ~/.ssh ~/dath-261-group10
          ssh-keygen -t ed25519 -f ~/.ssh/staging_ed25519 -N ""
          cat ~/.ssh/staging_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          cp -r . ~/dath-261-group10/
          echo "STAGING_KEY<<EOF" >> $GITHUB_ENV
          cat ~/.ssh/staging_ed25519 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Deploy to Cloud VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "172.17.0.1"
          username: "runner"
          key: ${{ env.STAGING_KEY }}
          script: |
            cd ~/dath-261-group10
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "=== Staging Deployment Initiated for branch: $TARGET_BRANCH ==="
            docker compose config
            docker compose build
            docker compose up -d
            docker compose ps
            docker system prune -f
            echo "=== Staging Cloud Deployment Completed Successfully ==="
