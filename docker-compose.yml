services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-edupulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./service/ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-edupulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edupulse}
      INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      OOS_THRESHOLD: ${OOS_THRESHOLD:-0.65}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - hf-models:/models

volumes:
  pgdata:
  hf-models:
