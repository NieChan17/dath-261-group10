services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edupulse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-edupulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_staging_password}
      POSTGRES_DB: ${DB_NAME:-edupulse_staging}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edupulse-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-edupulse_user} -d ${DB_NAME:-edupulse_staging}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupulse-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-edupulse_user}:${DB_PASSWORD:-secure_staging_password}@postgres:5432/${DB_NAME:-edupulse_staging}
      PORT: 5000
    networks:
      - edupulse-network

  rag-service:
    build:
      context: ./service/ai-service
      dockerfile: Dockerfile
    container_name: edupulse-rag
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-edupulse_user}:${DB_PASSWORD:-secure_staging_password}@postgres:5432/${DB_NAME:-edupulse_staging}
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      OOS_THRESHOLD: ${OOS_THRESHOLD:-0.65}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - hf_models:/models
    networks:
      - edupulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupulse-frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - edupulse-network

  nginx:
    image: nginx:alpine
    container_name: edupulse-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - rag-service
    networks:
      - edupulse-network

  certbot:
    image: certbot/certbot:latest
    container_name: edupulse-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  edupulse-network:
    driver: bridge

volumes:
  postgres_data:
  hf_models:
