events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Hide Nginx version from Server header (OWASP A05 Security Misconfiguration)
    server_tokens off;

    # File upload limit (courseware slides, assignments, materials)
    client_max_body_size 50M;

    # Rate Limiting Zones (OWASP A04/A07 Brute-Force & DoS Mitigation)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:5000;
    }

    upstream rag_upstream {
        server rag-service:8000;
    }

    # HTTP server - handles ACME challenge for SSL and reverse proxy
    server {
        listen 80;
        server_name _;

        # Global Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_hide_header X-Powered-By;

        # ACME challenge for Let's Encrypt / Certbot SSL certificate issuance & renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Client frontend app
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Strict rate-limited Auth endpoints (10 req/min with burst=5)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / /;
        }

        # Backend Core API (30 req/s with burst=40)
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / /;
        }

        # Block public direct access to internal RAG ingestion/audit endpoints
        location ~ ^/rag/(ingest|materials|review) {
            return 403;
        }

        # AI RAG Microservice public endpoints (auth enforced via X-Internal-Token)
        location /rag/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://rag_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

